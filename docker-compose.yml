services:
  engine:
    build: .
    command: sh detection/run_loop.sh
    volumes:
      - ./reports:/app/reports
      - /var/log/auth.log:/var/log/auth.log:ro
      - /var/log/audit/audit.log:/var/log/audit/audit.log:ro

  dashboard:
    build: .
    command: python3 -m uvicorn dashboard.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./reports:/app/reports

  cowrie:
    restart: unless-stopped
    build:
      context: ./honeypot/cowrie
      dockerfile: docker/Dockerfile
    ports:
      - "2222:2222"
      - "2223:2223"
    volumes:
      - cowrie-etc:/cowrie/cowrie-git/etc
      - cowrie-var:/cowrie/cowrie-git/var
    cap_drop:
      - ALL
    read_only: true
    security_opt:
      - no-new-privileges:true

volumes:
  cowrie-etc:
  cowrie-var:
